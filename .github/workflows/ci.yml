name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lockfile, trek data, typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockfile only uses registry.npmjs.org
        run: pnpm vitest run --project unit tests/unit/lockfile-hosts.test.ts
      - run: pnpm treks:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Integration (Postgres + pgvector, Ollama with Gemma)
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: pagdandi
          POSTGRES_DB: pagdandi_test
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI container, reachable only from this job
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U pagdandi" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://pagdandi@127.0.0.1:54329/pagdandi_test
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      CHAT_MODEL: gemma4:e2b # the smaller Gemma 4, for CI's CPU
      FORECAST_MODE: fixtures # recorded sample forecasts: the digest test never calls Open-Meteo from a runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama-ci
          key: ollama-0.35.1-gemma4-e2b-embeddinggemma-300m
      - name: Start Ollama and pull the models
        run: |
          docker run -d --name ollama -p 11434:11434 -v "$HOME/.ollama-ci:/root/.ollama" \
            ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 1; done
          docker exec ollama ollama pull embeddinggemma:300m
          docker exec ollama ollama pull gemma4:e2b
      - run: pnpm test:integration

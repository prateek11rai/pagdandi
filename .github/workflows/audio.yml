name: Audio intros

# Run by hand (Actions → Audio intros → Run workflow). Generates the missing intros with ElevenLabs, or the
# treks you name, and opens a pull request with the MP3s. Real audio only: if the credits run out, the
# pull request has what finished and the rest keep showing "not recorded yet".
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Treks to generate, comma-separated (e.g. kedarkantha,triund). Leave empty for every trek without a file."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    name: Generate audio intros and open a pull request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (keeps the token, to push the branch)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SLUGS: ${{ inputs.slugs }}
        run: |
          if [ -z "$SLUGS" ]; then pnpm audio --missing; exit; fi
          [[ "$SLUGS" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]] || { echo "slugs must be lowercase trek slugs, comma-separated"; exit 1; }
          pnpm audio --only "$SLUGS"
      - name: Open a pull request with the new files
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git add public/audio
          if git diff --cached --quiet; then echo "No new audio."; exit 0; fi
          total=$(cat public/audio/*.mp3 | wc -c)
          [ "$total" -le 31457280 ] || { echo "public/audio is $total bytes, over the 30 MB budget; not opening a pull request"; exit 1; }
          branch="audio/run-$RUN_ID"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Add audio intros (workflow run $RUN_ID)"
          git push -q origin "$branch"
          files=$(git diff --name-only HEAD~1 -- public/audio | sed 's/^/- /')
          gh pr create --base main --head "$branch" --title "Add audio intros" \
            --body "Generated with ElevenLabs by the Audio intros workflow (run $RUN_ID), from each trek's audio_script. Listen to one or two before merging.

          $files"

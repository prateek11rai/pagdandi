highlights:
  - A wide alpine meadow facing Bandarpunch, Srikanta, Jaonli and Draupadi ka Danda.
  - Shepherds and their herds on the grass in summer, and deep snow fit for skiing in winter.
  - A climb through forest and rhododendron, passing the Sheshnag temple on the way.
  - The Butter Holi (Andhuri) festival that Raithal villagers hold on the meadow each August.   # weak source: Wikipedia cites a trek operator's blog for this

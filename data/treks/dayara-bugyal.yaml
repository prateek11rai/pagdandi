highest_point:
  name: Dayara Bugyal (upper meadow)
  altitude_m: 3500
  # conflict: Uttarkashi district (and Wikipedia's body text, citing it) says the meadow runs from 2600 to 3500 m; state tourism and Wikivoyage's Gangotri page say 3,048 m; Wikipedia's infobox says 3639 m; Wikivoyage's Dehradun page says about 3,660 m; OSM peak node 7015416241 (Dayara) has ele 3651; kept the district figure

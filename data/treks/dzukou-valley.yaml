getting_there:
  railhead: {name: Dimapur (DMV), distance_km: null}
  airport: {name: Dimapur, iata: DMU, distance_km: 96}   # Wikivoyage (Viswema): about 96 km to Viswema
  road_head: Viswema
  notes: >-
    Viswema sits on the highway about 22 km south of Kohima. From the village
    a Tata Sumo taxi climbs to a rest house above Teyozwü hill; from there it
    is about 40 minutes of climbing to the ridge where Dzükou begins, then
    roughly two more hours on foot to the main valley. The newer Jakhama
    route, from the next village north, has no vehicle ride and a longer
    walk. A six-hour trail also comes in from Mount Tempü on the Manipur
    side.
# weak source only: Incredible India's contributed guide page recommends May to October but says to avoid the July-September rains; Wikipedia says the wildflowers bloom May-September.
season_months: [5, 6, 10]
# conflict: ilp.nagaland.gov.in says the foreigner ILP is Rs 500; Wikipedia (Inner Line Permit) says Rs 300. Official page preferred.
permits: >-
  Visitors who are not indigenous to Nagaland, Indian or foreign, need a
  Nagaland Inner Line Permit, applied for online; the official fee is Rs 200
  for domestic visitors and Rs 500 for foreigners, each valid for 30 days. At
  the valley entry point village authorities collect a refundable deposit on
  plastic items, returned when you carry them back out, and the tourism
  ministry advises going with a local guide. Access from the Nagaland side is
  regulated by Southern Angami village bodies, which have fined visitors who
  start fires.

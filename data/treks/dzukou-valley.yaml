highlights:
  - A wide bowl of rolling green hills and dwarf bamboo, cut by a cold stream, opens up behind Mount Japfü.
  - The pink Dzükou lily opens in May and June, and other wildflowers keep the meadows colourful until about September.
  - The forested slopes around the valley shelter Blyth's tragopan, Nagaland's state bird.
  - You can sleep in the government-run rest house on the valley rim or camp near it.
  - The valley straddles the Nagaland-Manipur border and is claimed by communities on both sides.

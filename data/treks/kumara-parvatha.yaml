permits: >-
  Trekkers need Forest Department permission, issued at the forest office near
  Bhattara Mane, about 6 km up from Kukke Subramanya (en.wikipedia). Camping is
  not allowed on the summit, only at designated points along the way with
  Forest Department permission (Karnataka Tourism, pages dated 2020 and July 2025).
  Wikipedia says trekking is prohibited from June to September. On 11 October
  2026, Aranya Vihaara, the Forest Department's online trek-booking portal, did
  not list Kumara Parvatha among its Dakshina Kannada or Kodagu treks. No official
  page found gives the current fee, daily quota or booking method, so check with
  the Subramanya forest range before planning.

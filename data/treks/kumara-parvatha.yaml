highlights:
  - The walk starts at the gates of the Kukke Subramanya temple town and climbs through thick evergreen forest.
  - Above the trees, the trail crosses open grassy ridges past Bhattara Mane and the Girigadde viewpoint.
  - Near the top the path threads between huge boulders, often in drifting mist, to two small shrines on the summit.
  - The surrounding hills feed the Kumaradhara, the main tributary of the Netravathi.
audio_script: >-
  The walk starts at the gates of the Kukke Subramanya temple town and climbs through thick
  evergreen forest. This trek offers a deep connection with the wild beauty of the Pushpagiri
  Wildlife Sanctuary, taking you through landscapes that feel both ancient and vibrant. As you
  ascend, the dense forest gives way to open grassy ridges, offering views past the Bhattara Mane
  and the Girigadde viewpoint. Higher up, the trail becomes more intimate, winding between massive
  boulders, often shrouded in soft mist, leading you towards the small shrines at the summit. You
  will be walking through terrain that feeds the Kumaradhara, the primary tributary of the
  Netravathi. Reaching the Kumara Parvatha summit provides a significant experience amidst these
  rolling hills. This journey unfolds over two days, best undertaken between October and May. The
  day-by-day plan and permits are on the Pagdandi page.

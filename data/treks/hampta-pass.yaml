highlights:
  - A single crossing takes you from the wooded, green Kullu side to the dry, bare landscape of Lahaul's Chandra valley.
  - On the Kullu side the valley holds pine and rhododendron woods, open meadows and waterfalls, with wildflowers between about 3,000 and 3,800 m.
  - Higher up the route crosses glaciers and fast-flowing streams, under rock walls, hanging glaciers and 6,000 m peaks such as Deo Tibba and Indrasan.
  - The pass takes its name from Hampta village, which sits below Sethan.
  - Chhatru on the far side is a jumping-off point for Chandratal lake.

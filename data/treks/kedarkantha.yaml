  # weak source: that Wikipedia sentence is cited to a trekking company's web page
budget_inr: {min: 6000, max: 12000, basis: "Pagdandi rough estimate: shared taxi or bus Dehradun-Sankri-Dehradun, 3 trail days with a local guide and porter share, tent and sleeping bag hire, food, and the park permit."}
itinerary: []        # no open source lays out day stages; Wikipedia's Sankri page names the campsites Juda Ka Talab, Kedarkantha Base Camp and Hargaon
highlights:
  - A full-circle summit panorama that takes in Swargarohini, Bandarpunch and Black Peak.
  - Juda Ka Talab, a small high lake used as a campsite, tied in local myth to Shiva's hair.
  - Mostly pine forest, with deodar, oak and rhododendron between about 2,000 and 3,000 m.
  - Spring wildflowers such as primulas and wild strawberries from late March into April.
audio_script: >-
  A full-circle summit panorama that takes in Swargarohini, Bandarpunch and Black Peak. This trek
  through the Govind Wildlife Sanctuary offers a genuine connection with the wild heart of the
  Himalayas. You will walk through beautiful pine forests, interspersed with deodar, oak, and
  rhododendron as you ascend. Early in the season, you will see spring wildflowers like primulas
  and wild strawberries carpeting the slopes. You will also reach Juda Ka Talab, a beautiful high
  lake that serves as a perfect spot to rest. Reaching the Kedarkantha summit at 3810 metres is a
  rewarding experience, offering incredible views. This journey takes three days and begins from
  Sankri during the months of April through June, or September through November. The day-by-day
  plan and permits are on the Pagdandi page.

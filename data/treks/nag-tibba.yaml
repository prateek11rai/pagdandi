highlights:
  - A small temple to Nag Devta, the snake god, on the summit; villagers come to pray for their cattle.
  - Views across to the Bandarpunch massif on the Yamunotri side.
  - The highest point of the Lesser Himalaya in the Garhwal division, reachable in a weekend.
audio_script: >-
  A small temple to Nag Devta, the snake god, on the summit; villagers come to pray for their
  cattle. This journey up Nag Tibba is a real reward for the effort you put in. You will
  experience the highest point of the Lesser Himalaya in the Garhwal division, and you can achieve
  this trek in just two days, starting from Pantwari. As you climb, you will be treated to
  sweeping views across to the Bandarpunch massif on the Yamunotri side. Reaching the summit at
  3022 metres offers a powerful perspective on the landscape. It is a rewarding experience to
  connect with the mountains and the traditions of the people who live here. The day-by-day plan
  and permits are on the Pagdandi page.

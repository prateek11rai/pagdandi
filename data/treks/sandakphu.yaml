getting_there:
  railhead: {name: New Jalpaiguri (NJP), distance_km: null}
  airport: {name: Bagdogra, iata: IXB, distance_km: null}
  road_head: Manebhanjan
  # conflict: darjeeling.gov.in and wbtourism.gov.in put Manebhanjan about 26 km from Darjeeling; Wikipedia says 28 km (Manebhanjyang and Sandakphu articles) or 51 km (Singalila National Park article). Official pages preferred.
  notes: >-
    Buses run from Siliguri to Manebhanjan by way of Sukhiapokhri, and jeeps
    and buses cover the stretch from Darjeeling; wbtourism.gov.in puts
    Manebhanjan about 26 km from Darjeeling and 92 km from Siliguri. A road
    now climbs all the way to Sandakphu, and the old Land Rovers based at
    Manebhanjan carry visitors who would rather ride. West Bengal Tourism also mentions driving from New
    Jalpaiguri to Dhotrey (Dhotre) instead of Manebhanjan.
# conflict: darjeeling.gov.in names April, May and October-November as the best months, with the first half of December also good; Wikipedia (Singalila National Park) gives March-May and mid-September to early December. Official page preferred.
season_months: [4, 5, 10, 11, 12]
permits: >-
  The trail enters Singalila National Park at a checkpost on the park boundary
  near Tumling, and the park is shut to visitors from 16 June to 15 September
  for the monsoon (Wikipedia). Trekkers' huts on the route are run by the hill
  council's tourism wing and can be booked in advance in Darjeeling. Entry fees
  and any guide rule were not found on an official page.

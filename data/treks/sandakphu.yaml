highlights:
  - The summit view takes in Everest, Kangchenjunga, Lhotse and Makalu, four of the five highest mountains on Earth.
  - Seen from here, the Kangchenjunga range has the reclining outline known as the Sleeping Buddha.
  - Rhododendrons bloom along the ridge from mid-April into early June, with primulas and other small mountain flowers on the ground below.
  - Singalila National Park is home to the red panda and the Himalayan black bear, and is a well-known spot for birdwatching.
  - The trail runs along the India-Nepal border and dips in and out of Nepal around Meghma and Tumling.

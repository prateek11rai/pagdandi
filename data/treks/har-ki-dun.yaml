getting_there:
  railhead: {name: Dehradun, distance_km: 200}
  airport: {name: Dehradun (Jolly Grant), iata: DED, distance_km: null}
  road_head: Sankri
  notes: >-
    The trail heads up the Supin river from Sankri through the villages of Taluka,
    Dhatmeer, Gangad and Osla to the valley. Hindi Wikipedia counts the walk from
    Taluka, the next village up the valley from Sankri, and says the valley is about
    25 km beyond it. Purola is the last town with an ATM before Sankri. The state
    tourism page puts Jolly Grant airport about 230 km from the park, without a
    figure for Sankri itself.
season_months: [4, 5, 6, 9, 10, 11]   # official best time for Govind National Park; Wikipedia and Hindi Wikipedia add that the valley itself is under snow from October to March
permits: >-
  Har Ki Dun is inside Govind Pashu Vihar National Park and Sanctuary. Register online
  first, then pick up the paper permit at the park's head office in Purola.
last_mobile_signal: Sankri   # weak source: the Wikipedia sentence is cited to a trekking company's web page

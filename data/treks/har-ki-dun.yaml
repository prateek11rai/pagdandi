highlights:
  - A cradle-shaped hanging valley ringed by alpine meadows, with Swargarohini rising at its head.
  - Old villages such as Osla, where people keep a temple to Duryodhana of the Mahabharata.   # weak source: only the operator-style Wikivoyage Dehradun passage places the temple at Osla
  - Deodar forest along the Supin river on the way in.
  - A chance to see the Himalayan monal, Uttarakhand's state bird.
  - An onward trail to the glacial lake of Ruinsara Tal below the Bandarpunch glacier.

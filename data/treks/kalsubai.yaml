highlights:
  - A small shrine to the goddess Kalsubai sits right on the summit, busiest during Navratri.
  - Iron ladders bolted onto the steeper rock bands carry you up the final stretches.
  - The top looks down on the Bhandardara reservoir (Arthur Lake) and across to Alang, Madan, Kulang and Harishchandragad.
  - In the monsoon the flanks turn green and streams and small waterfalls line the path.

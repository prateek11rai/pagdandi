budget_inr: {min: 8000, max: 15000, basis: "Pagdandi rough estimate: shared taxi Kathgodam-Lohajung-Kathgodam, 5 trail days with a local guide and porter or mule share, tent hire, carried food, and small local fees."}
itinerary: []        # Wikivoyage names camps at Bekaltal and Brahmatal but gives no day-by-day plan; Hindi Wikipedia puts Bekaltal at 8,000 ft (about 2440 m)
highlights:
  - Views east to Trishul and Nanda Ghunti, with the Bedni Bugyal and Roopkund side in sight.
  - A high lake where, by local belief, Brahma sat in meditation, with a large camping ground beside it.
  - Bekaltal, a forest-ringed pond with an old Nag Devta shrine that freezes over in winter.
  - Treeline country above the lake, with sunrise and sunset over rows of ridges.

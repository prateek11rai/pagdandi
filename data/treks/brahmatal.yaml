  road_head: Lohajung
  notes: >-
    Two road approaches reach Lohajung: from Kathgodam by way of Garur and Gwaldam,
    then Tharali or Dewal, or from Rishikesh by way of Srinagar and Karnaprayag.
    Expect a mostly uphill climb on an unmarked path, and ask local people if the
    way is unclear. Nothing is sold to eat on the trail, so carry all your food.
    Wikivoyage reports steady mobile data in Lohajung but says nothing about signal
    on the trail.

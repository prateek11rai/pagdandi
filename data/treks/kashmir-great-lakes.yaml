highlights:
  - A string of high alpine lakes, from the twin pair of Vishansar and Krishansar to Gadsar, the chain of Satsar lakes, and Gangabal and Nundkol under Mount Harmukh.
  - Three passes on the way (Nichnai, Gadsar and Zajibal), each above 4,000 m.
  - Gujjar and Bakarwal herders graze their flocks in the meadows through the summer.
  - Gangabal is a pilgrimage lake, and the yearly Harmukh-Gangabal Yatra begins at the Naranag temples.
  - Naranag at the end has the ruins of a cluster of 8th-century Shiva temples.

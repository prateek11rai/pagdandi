getting_there:
  # to Sonamarg, per the Ganderbal district page. Wikipedia (Srinagar railway station) shows a nearer
  # station at Nowgam, Srinagar on the Jammu-Baramulla line, but no open source gave its distance to Sonamarg.
  railhead: {name: Jammu, distance_km: 360}
  airport: {name: Srinagar (Sheikh ul-Alam), iata: SXR, distance_km: 102}   # to Sonamarg, per the Ganderbal district page
  road_head: Sonamarg (Shitkadi)
  # conflict: Wikipedia (Gangabal Lake) says Srinagar-Naranag is about 45 km by road, Wikipedia (Nundkol Lake, Satsar) says 65 km
  notes: >-
    Sonamarg is about 87 km from Srinagar on NH 1D, under three hours by car
    or bus. The walk starts at Shitkadi in Sonamarg and ends at
    Naranag, about 16 km from Kangan, so plan separate road transport for
    each end. The trek can also be walked in reverse from Naranag, though
    starting at Sonamarg is usually considered easier.
season_months: [6, 7, 8, 9]

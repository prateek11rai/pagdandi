    max_altitude_m: 4100
    distance_km: null
  - day: 3
    from: Vishansar Lake
    to: Gadsar Lake
    camp_altitude_m: 3600   # lake surface (Wikipedia)
    max_altitude_m: 4190
    # conflict: Wikipedia (Vishansar Lake) says Gadsar Lake is about 9 km over Gadsar Pass, Wikivoyage (Sonamarg) gives 23 km to Gadsar
    distance_km: 9
  - day: 4
    from: Gadsar Lake
    to: Satsar Lakes
    camp_altitude_m: 3610   # lake elevation (Wikipedia, Satsar Lake)
    max_altitude_m: null
    distance_km: null
  - day: 5
    from: Satsar Lakes
    to: Gangabal Lake
    camp_altitude_m: 3576   # lake surface (Wikipedia)
    max_altitude_m: 4041    # Zajibal pass (Wikipedia, Satsar)
    distance_km: null
  - day: 6
    from: Gangabal Lake
    to: Naranag
    camp_altitude_m: null
    max_altitude_m: null
    # conflict: Wikipedia (Gangabal Lake) says about 15 km, Wikivoyage (Sonamarg) says 17 km

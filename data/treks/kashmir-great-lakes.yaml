last_mobile_signal: Nichnai Pass (BSNL only, and not reliable)
budget_inr: {min: 16000, max: 30000, basis: "Pagdandi rough estimate: taxi Srinagar-Sonamarg and Naranag-Srinagar, six days of local guide, cook, pony share, tents and meals in a small group."}
itinerary:
  # Wikipedia (Great Lakes Trek): first camp at "Table Top" (Shaukdari), 6-7 hours from the drop-off;
  # day 2 crosses Nichnai Pass to the Vishansar-Krishansar lakes.
  - day: 1
    from: Sonamarg
    to: Shaukdari (Table Top)

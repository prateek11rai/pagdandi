area: Lakes below Harmukh between the Sind valley (Sonamarg) and Naranag, Ganderbal district (Gadsar Lake falls in Bandipora district)
# difficult per rubric: three pass crossings, the highest above 4,000 m
# (Wikipedia rates it moderate to moderate-difficult).
difficulty: difficult
days: 6   # Wikipedia: usually 6-7 days; 6 walking legs listed below, following the lake order Wikipedia gives
distance_km: 68
highest_point:

highlights:
  - The path starts gently through tea gardens, then climbs steeply onto open grassland.
  - About halfway up sits Hridaya Saras, a small heart-shaped lake said never to dry out.
  - On clear days the summit, Wayanad's highest point, looks out towards Tamil Nadu and Karnataka.
  - Birdwatchers can look for the Malabar whistling thrush and white-bellied treepie on the way up.
audio_script: >-
  The path starts gently through tea gardens, then climbs steeply onto open grassland. This day
  hike to Chembra Peak offers a real connection with the landscape of Wayanad. As you ascend, you
  will see the unique beauty of the area, beginning with the lush greenery of the tea plantations
  before the terrain opens up. About halfway through your journey, you’ll reach Hridaya Saras, a
  tranquil, heart-shaped lake that remains consistently full. Reaching the summit, Wayanad’s
  highest point at 2100 metres, provides expansive views where clear days allow you to see across
  into Tamil Nadu and Karnataka. Keep your eyes peeled along the way, as birdwatchers can spot the
  Malabar whistling thrush and the white-bellied treepie. This experience takes place during the
  season from September through March. The day-by-day plan and permits are on the Pagdandi page.

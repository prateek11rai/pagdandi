permits: >-
  The trek is run by the Kerala Forest Department (South Wayanad division) and
  ticketed through its ecotourism portal. On 11 October 2026 the portal's Chembra
  Peak Trekking listing showed online booking as "temporarily unavailable". The
  same listing gives entry from 7 to 9 am only, and says tickets not claimed in
  that window go to walk-in visitors at the counter. Fees are Rs 800 per Indian
  adult, Rs 200 per Indian student (not on weekends or holidays) and Rs 1,600 per
  foreigner, and children under 10 go free. A group needs at least 5 people to
  start. Camera fees are extra and paid at the counter, and plastic is banned. The
  centre closes whenever the Wayanad district administration issues a red alert.
  Older group rates on the Kerala Tourism ecotourism page are out of date.
  Wikipedia says visits are run by the Chembra Peak VSS (forest protection
  committee) with forest guides.

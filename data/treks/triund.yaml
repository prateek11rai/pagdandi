highlights:
  - The wall of the Dhauladhar rises straight behind the meadow, while the Kangra valley spreads out far below to the south.
  - The path climbs through mixed forest of oak, deodar and rhododendron, with small tea stalls along the way.
  - The last kilometre is the hard part, a run of about 22 switchbacks up to the open grassy ridge.
  - The slopes hold monal pheasants and many other birds, and black bears and leopards live in the forests.
  - The British used the ridge as a base camp for climbs towards Indrahar Pass and the Dhauladhar peaks.
audio_script: >-
  The wall of the Dhauladhar rises straight behind the meadow, while the Kangra valley spreads out
  far below to the south. This day hike through the southern slopes of the Dhauladhar range offers
  a powerful connection with the mountains. As you walk, the path takes you through a mix of oak,
  deodar, and rhododendron forest, with small tea stalls appearing along the way to offer a rest.
  The final stretch brings you up a series of switchbacks to reach the open grassy ridge at
  Triund. From this point, you gain a view that speaks to the area's past, as the ridge once
  served as a base camp for climbs towards the Dhauladhar peaks. The slopes are home to monal
  pheasants and various birds, and you will also encounter the forests where black bears and
  leopards live. The day-by-day plan and permits are on the Pagdandi page.

permits: >-
  None of the open sources checked mention a permit or entry fee. Himachal
  Pradesh's online Trekking Management System lists the McLeod Ganj to
  Indrahar Pass route through Triund, so you can file your plan with the
  authorities before you go. Wikipedia's Dharamkot article says (without a
  citation) that hikers sign in at the Galu Devi temple. A forest rest house
  at the top takes overnight guests.

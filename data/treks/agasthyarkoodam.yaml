highlights:
  - Over three days the route moves from shaded evergreen forest to open grassland and bare rock, crossing streams and small falls.
  - The last climb crosses into Tamil Nadu to a summit with a small stone figure of the sage Agastya.
  - The range shelters thousands of plant species, including many medicinal herbs, orchids, mosses and ferns.
  - Birders look for rarities such as the broad-tailed grassbird and Nilgiri wood pigeon.
  - The Thamirabarani, Karamana and Neyyar rivers all rise on this mountain.
audio_script: >-
  Agasthyarkoodam, in Kerala's Agasthyamala Biosphere Reserve. Three days from Bonacaud: evergreen
  forest, then open grassland and bare rock, with streams and small falls on the way. The last
  climb crosses into Tamil Nadu to a summit at 1868 metres, where a small stone figure of the sage
  Agastya stands. Entry is by a seasonal forest pass only, about mid-January to Shivaratri, a
  hundred a day. The Athirumala base camp provides food and beds.

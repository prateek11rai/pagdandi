  notes: >-
    Vehicles go only as far as Bonacaud, where the walk starts at the forest
    picket station; KSRTC buses run there from Thiruvananthapuram. The
    Neyyar-Agasthyarkoodam route is not open to the public.
# conflict: keralatourism.org (2020) says the season runs from Makaravilakku (mid-January) to
# Shivaratri (after mid-February); en.wikipedia says January to mid-March. Official window used.
season_months: [1, 2]
# Details left out of the text below: the Service Plus listing needs registration but no documents and
# gives no fee or dates; the 2027 season was not yet listed on 2026-10-11; the undated Kerala Tourism
# event page (Rs 350, two ID copies) also repeats the old ban on women, so its details may be dated.
permits: >-
  Entry is only on a seasonal Kerala Forest Department pass, booked online
  through the government's Service Plus portal (Wildlife Warden,
  Thiruvananthapuram). Kerala Tourism (March 2020) says 100 passes are issued a
  day, the season runs from about mid-January to Shivaratri, and the Athirumala
  base camp provides food and beds. An undated Kerala Tourism page gives Rs 350
  per person and asks for two ID copies. Women have been allowed on the trek
  since a 2018 court ruling.

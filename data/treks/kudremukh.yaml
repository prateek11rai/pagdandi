highlights:
  - The name means "horse face" in Kannada, after the peak's profile from one side.
  - The trail climbs out of dense forest onto open, rolling shola grassland broken by streams.
  - High on the mountain you pass the remains of Lobo's house, a farm left empty long ago.
  - This is lion-tailed macaque country, and the hills feed the Tunga, Bhadra and Netravathi rivers.
audio_script: >-
  Kudremukh, in Karnataka's Kudremukh National Park. The name means horse face in Kannada, after
  the peak's profile from one side. A long day from Mullodi: the trail climbs out of dense forest
  onto open, rolling shola grassland broken by streams, to the peak at 1894 metres. This is
  lion-tailed macaque country, and the hills feed the Tunga, Bhadra and Netravathi rivers. Book a
  slot on the Forest Department's Aranya Vihaara portal; daily entries are capped.

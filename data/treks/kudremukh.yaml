  notes: >-
    Reach Kalasa by bus (services run from Mangaluru, Udupi, Chikkamagaluru and
    Bengaluru), then take a jeep to Mullodi village, where the trail begins.
    Mangaluru Junction is the larger railhead, further away than Udupi.
season_months: [10, 11, 12, 1, 2]
permits: >-
  Book online through Aranya Vihaara, the Karnataka Forest Department's trek
  portal. On 11 October 2026 it listed the Kudremukha Trek (Chikkamagaluru
  district) as open, starting and ending at the Mullodi anti-poaching camp, with
  about 8 hours allowed. Slots can be booked from 1 to 30 days ahead. Under rules
  in force since 15 July 2026, cancelling 8 or more days out refunds half the
  fare, cancelling within 7 days refunds nothing, and you must bring the original
  ID used to book. Report at the start point at least 10 minutes before your
  slot. Karnataka Tourism (July 2025) adds that daily entries are capped. The
  Forest Department's undated park page lists entry at Rs 200 per adult, Rs 100
  per child and Rs 1,000 per foreigner, and says department staff go with
  trekkers as guides. It also says the park is open nine months of the year, and
  the monsoon is the poorest time to visit. The portal's current trek fee is
  shown only after login and was not checked.

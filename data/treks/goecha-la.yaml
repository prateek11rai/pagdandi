highlights:
  - The pass looks straight at the southeast face of Kangchenjunga, the third highest mountain on Earth.
  - Dzongri and its viewpoint take in a long line of big peaks, among them Kabru, Rathong, Koktang and Pandim.
  - The lower trail climbs through magnolia and rhododendron forest above the Rathong river before opening onto high meadows.
  - Sikkim's tourism department calls this the state's most popular trek, known for mountain views, summer flowers and birdlife.
  - Yuksom, the starting village, was the first capital of the old Kingdom of Sikkim.
audio_script: >-
  The pass looks straight at the southeast face of Kangchenjunga, the third highest mountain on
  Earth. This trek offers you an incredible journey into the heart of the Himalayas, taking you
  through dramatic landscapes of Sikkim. You will experience the climb, culminating at the high
  point of Goecha La. As you travel, the lower trail guides you through forests blooming with
  magnolia and rhododendron, winding alongside the Rathong river before opening up into expansive
  high meadows. At Dzongri, the viewpoint provides a sweeping panorama across a vast array of
  major peaks, including Kabru, Rathong, Koktang, and Pandim. You will witness the mountain views
  that have made this the state's most popular trek. Starting your adventure in Yuksom, the
  historic first capital of the old Kingdom of Sikkim, you will absorb the beauty of this region,
  noticing the summer flowers and vibrant birdlife along the way. The day-by-day plan and permits
  are on the Pagdandi page.

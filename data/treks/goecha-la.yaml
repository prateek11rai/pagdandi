permits: >-
  The whole route lies in the Khangchendzonga National Park axis, which Sikkim
  lists as a Protected Area: both Indian and foreign trekkers need a Protected
  Area Permit, issued for trekking by the Tourism and Civil Aviation
  Department's Adventure Cell or district tourism offices in Gangtok and
  Pelling. Indians must show a passport, voter ID, driving licence or other
  government photo ID (Aadhaar is not accepted as proof of nationality) plus
  two photos. Foreigners also need a Restricted Area Permit to enter Sikkim at
  all, and get a trekking PAP only as a group of two or more with the trek
  arranged through a registered travel agency. The state's adventure page adds
  that a special park pass is needed, issued to Indian visitors by Sikkim's
  Home Department. Fees were not listed on the official pages checked.

highlights:
  - Jingkieng Nongriat, the famous double-decker bridge, is two spans of living fig-tree roots stacked over a stream.
  - Khasi villagers grow these bridges by training aerial roots across gorges over many years, and they carry people for generations.
  - From Tyrna the path drops roughly 3,500 steps through forest, crossing streams and passing a few single-span root bridges on the way down.
  - The Khasi root-bridge landscapes have been on India's UNESCO World Heritage tentative list since 2022.
  - Nongriat has guest house rooms, so you can stay the night instead of climbing straight back up.
audio_script: >-
  Ready to experience something truly special? We’re heading out to Nongriat in Meghalaya, a
  journey that promises incredible sights and a real connection to nature. This day hike starts at
  Tyrna, and you’ll begin a descent through lush forest, taking a long way down with many steps,
  crossing streams, and spotting some beautiful single-span root bridges along the way. The real
  magic awaits when you reach Jingkieng Nongriat. Imagine seeing the famous double-decker
  bridge—two amazing spans of living fig-tree roots carefully stacked over a stream. These aren't
  just structures; Khasi villagers have nurtured these bridges across gorges for generations,
  allowing them to carry people for years. This landscape, filled with these incredible root
  bridges, is something truly unique. If you want to take it all in, Nongriat has guest house
  rooms if you prefer to stay the night instead of climbing straight back up. The day-by-day plan
  and permits are on the Pagdandi page.

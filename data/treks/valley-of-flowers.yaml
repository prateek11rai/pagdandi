highlights:
  - Alpine meadows with more than 600 kinds of flowering plants, at their fullest from July to September.
  - A UNESCO World Heritage Site, paired with Nanda Devi National Park next door.
  - Rare animals such as the snow leopard, musk deer and Asiatic black bear, and the Himalayan monal.
  - Waterfalls and streams along the trail, and the memorial to botanist Joan Margaret Legge inside the valley.
  - An optional steep climb from Ghangaria to the glacial lake and gurdwara at Hemkund.
audio_script: >-
  Are you ready to experience something truly special? Imagine yourself walking through a
  landscape so vibrant, it feels like stepping into another world. This journey takes you into the
  Valley of Flowers, a breathtaking part of Uttarakhand. For three glorious days, you’ll be
  immersed in a place that is a UNESCO World Heritage Site. As you trek, you’ll wander through
  stunning alpine meadows, especially vibrant between July and September, bursting with over six
  hundred types of flowers. You’ll be surrounded by the sound of rushing streams and waterfalls,
  and you’ll even come across the memorial to botanist Joan Margaret Legge. Keep your eyes peeled,
  because you might spot rare wildlife like the snow leopard or the Himalayan monal. And if you
  feel adventurous, there’s an option to climb up to a glacial lake and a gurdwara. The day-by-day
  plan and permits are on the Pagdandi page.

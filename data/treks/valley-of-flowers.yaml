  notes: >-
    Roads end at Govindghat on the Rishikesh-Badrinath highway. The first 4 km
    of the trail to Ghangaria is a road served by shared taxis, after which it
    is a footpath; mules and porters can be hired. Hemkund lake and gurdwara are
    an optional extra day from Ghangaria, much higher than the valley (Wikipedia
    gives 4572 m for the gurdwara, Wikivoyage 4,160 m for the lake) and closed
    from October through April.
season_months: [5, 6, 7, 8, 9, 10]   # conflict: state tourism says May to October (peak bloom July to September), Wikipedia says the park opens only June to October; kept official
permits: >-
  The Forest Department office in Ghangaria issues the entry permit, which covers
  three days. Wikivoyage listed the fee in 2023 as Rs 150 for Indians and Rs 600 for
  foreigners. The park is open to day visitors only: nobody may camp or sleep inside
  it, and everyone has to be back in Ghangaria by 5 pm.

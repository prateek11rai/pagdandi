highlights:
  - Konkan Kada, a huge curved, overhanging cliff that drops away towards the Konkan coast, where a Brocken spectre sometimes shows in the mist.
  - The carved stone Harishchandreshwar temple, with water tanks and caves clustered around it.
  - Kedareshwar cave, where a large Shiva linga stands in a pool of icy water.
  - From Taramati, the top of the fort, the skyline runs across Alang, Madan, Kulang, Kalsubai and the Naneghat range.
  - The old Nageshwar temple at Khireshwar, whose carvings include a long reclining Vishnu.
audio_script: >-
  Harishchandragad, a hill fort near Malshej Ghat in Maharashtra. Two days from Khireshwar, with
  the night in the caves beside the carved stone Harishchandreshwar temple. Konkan Kada is a huge
  curved, overhanging cliff that drops away towards the Konkan coast; in mist, a Brocken spectre
  sometimes appears. From Taramati, the top of the fort at 1422 metres, the skyline runs across
  Alang, Madan, Kulang and Kalsubai. Best from October to February.

getting_there:
  railhead: {name: Kalyan, distance_km: null}
  airport: {name: Mumbai (Chhatrapati Shivaji Maharaj International), iata: BOM, distance_km: null}
  road_head: Khireshwar
  notes: >-
    Buses on the Kalyan-Malshej road stop at Khubi Phata, from where Khireshwar
    is about 5 km away, an hour on foot along the Pimpalgaon Joge dam or a short
    ride. State buses also run
    to Khireshwar from Pune, and Pune airport (PNQ) is the other nearby option.
    The shorter, gentler Pachnai route (about 3 km one way) starts on the
    Ahilyanagar side via Rajur.
# maharashtratourism.gov.in names October-February as the best season; it also describes
# June-September monsoon trekking as possible but slippery. Only the best-season months used.

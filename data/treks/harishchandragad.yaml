slug: harishchandragad
name: Harishchandragad
name_local: {text: हरिश्चंद्रगड, lang: mr}
state: Maharashtra
region: sahyadri
area: Kalsubai-Harishchandragad Wildlife Sanctuary, where Pune, Ahilyanagar and Thane districts meet near Malshej Ghat
# moderate, not easy: under 3,000 m, but the Khireshwar route climbs a railed rock patch above
# Tolar Khind and the official page rates it moderate to difficult, 6-7 hours one way.
difficulty: moderate
# mr.wikipedia advises allowing at least two days and lays out the stages: Khireshwar to the
# temple via Tolar Khind (~3 h), nights in the caves by the temple, Taramati a half-hour climb
# from the caves. The shorter Pachnai route is often done in a day but no source lays that out.
days: 2
distance_km: 14   # official page gives ~7 km one way from Khireshwar; doubled for the out-and-back
highest_point:
  name: Taramati peak
  # conflict: maharashtratourism.gov.in, OSM Taramati node and en.wikipedia infobox say 1422;
  # en.wikipedia text says Taramati is 1429; mr.wikipedia text gives about 4,850 ft (~1,480 m)
  # and its infobox 4,000 ft. Official value used.
  altitude_m: 1422
